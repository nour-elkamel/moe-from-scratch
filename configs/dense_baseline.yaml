model:
  vocab_size: 50304       # GPT-2 vocab, padded to nearest 64
  d_model: 512
  n_heads: 8
  n_layers: 12
  d_ff: null              # defaults to 4 * d_model = 2048
  max_seq_len: 256
  dropout: 0.1

data:
  dataset: "roneneldan/TinyStories"
  max_samples: null       # Use full dataset
  max_eval_samples: 1000

training:
  batch_size: 32
  lr: 3e-4
  min_lr: 3e-5
  warmup_steps: 200
  max_steps: 5000
  eval_every: 250
  save_path: "outputs/dense"
